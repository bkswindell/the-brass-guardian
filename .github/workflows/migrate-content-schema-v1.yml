name: One-time Aetherhaven Content Schema v1 migration

on:
  push:
    branches:
      - migration/content-schema-v1
    paths:
      - .github/workflows/migrate-content-schema-v1.yml
      - scripts/migrations/migrate_content_schema_v1.rb
      - scripts/migrations/enrich_content_schema_v1.rb
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  migrate:
    if: github.event_name == 'push' || github.head_ref == 'migration/content-schema-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/content-schema-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Normalize known legacy YAML spacing and preflight syntax
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'date'
          roots = %w[characters locations organizations artifacts vessels historical_events story_drafts story_arcs]
          failed = false
          roots.each do |root|
            next unless Dir.exist?(root)
            Dir.glob("#{root}/*.md").sort.each do |path|
              next if File.basename(path) == 'README.md'
              text = File.read(path, encoding: 'UTF-8')
              normalized = text.gsub(/^aliases:\[\]\s*$/, 'aliases: []')
              File.write(path, normalized, encoding: 'UTF-8') if normalized != text
              match = normalized.match(/\A---\s*\n(.*?)\n---\s*\n/m)
              unless match
                warn "MISSING FRONTMATTER: #{path}"
                failed = true
                next
              end
              begin
                YAML.safe_load(match[1], permitted_classes: [Date, Time, DateTime], aliases: false)
              rescue Psych::SyntaxError => error
                warn "INVALID YAML: #{path}: #{error.message.lines.first.strip}"
                failed = true
              end
            end
          end
          exit 1 if failed
          puts 'YAML preflight passed.'
          RUBY

      - name: Run deterministic Markdown migration once
        run: |
          if [ -f docs/development/AETHERHAVEN_CONTENT_SCHEMA_V1_MIGRATION_REPORT.md ]; then
            echo 'Deterministic migration already committed on this branch; preserving its original report.'
          else
            ruby scripts/migrations/migrate_content_schema_v1.rb
          fi

      - name: Run semantic migration audit and enrichment
        run: ruby scripts/migrations/enrich_content_schema_v1.rb

      - name: Export current Version 1 metadata for complete validation
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'json'
          require 'date'
          roots = %w[characters locations organizations artifacts vessels historical_events story_drafts story_arcs]
          records = []
          roots.each do |root|
            next unless Dir.exist?(root)
            Dir.glob("#{root}/*.md").sort.each do |path|
              next if File.basename(path) == 'README.md'
              text = File.read(path, encoding: 'UTF-8')
              match = text.match(/\A---\s*\n(.*?)\n---\s*\n/m)
              next unless match
              meta = YAML.safe_load(match[1], permitted_classes: [Date, Time, DateTime], aliases: false)
              records << meta if meta && meta['schema_version'] == 1
            end
          end
          File.write('website/.canon-schema-v1-migration-records.json', JSON.pretty_generate(records) + "\n")
          puts "Exported #{records.length} Version 1 records for locked-schema validation."
          RUBY

      - name: Validate every migrated metadata object with locked Version 1 validator
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { validateCanonRecords } from './website/scripts/lib/canon-schema-v1.mjs';
          const records = JSON.parse(readFileSync('./website/.canon-schema-v1-migration-records.json', 'utf8'));
          validateCanonRecords(records);
          console.log(`Validated ${records.length} migrated canonical records against Schema Version 1.`);
          NODE

      - name: Remove transient validation export
        run: rm website/.canon-schema-v1-migration-records.json

      - name: Commit audited canonical metadata
        run: |
          git config user.name 'Aetherhaven Schema Migration'
          git config user.email 'actions@users.noreply.github.com'
          git add characters locations organizations artifacts vessels historical_events story_drafts story_arcs docs/development/AETHERHAVEN_CONTENT_SCHEMA_V1_MIGRATION_REPORT.md docs/development/AETHERHAVEN_CONTENT_SCHEMA_V1_SEMANTIC_AUDIT.md
          if git diff --cached --quiet; then
            echo 'Migration audit produced no additional changes.'
            exit 0
          fi
          git commit -m 'migrate(canon): audit Aetherhaven Content Schema v1 semantics'
          git push origin HEAD:migration/content-schema-v1
