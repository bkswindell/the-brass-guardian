name: Validate Website

on:
  workflow_dispatch:
  pull_request:
    paths:
      - website/**
      - characters/**
      - locations/**
      - organizations/**
      - artifacts/**
      - vessels/**
      - historical_events/**
      - story_drafts/**
      - story_arcs/**
      - .github/workflows/validate-website.yml

permissions:
  contents: read

concurrency:
  group: website-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out proposed website/content
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify published production build
        run: npm run verify

      - name: Verify Archive Preview build
        run: npm run verify:archive-preview
