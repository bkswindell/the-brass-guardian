name: Reorganize Repository Layout

on:
  push:
    paths:
      - scripts/reorganize_repository_layout.py
      - .github/workflows/reorganize-repository-layout.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reorganize-repository-layout
  cancel-in-progress: false

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate migration script
        run: python -m py_compile scripts/reorganize_repository_layout.py

      - name: Reorganize repository
        run: python scripts/reorganize_repository_layout.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Show resulting root
        run: |
          echo "Repository root after migration:"
          find . -maxdepth 1 -mindepth 1 -printf '%f\n' | sort
          echo
          echo "Templates:"
          find templates -maxdepth 1 -type f -printf '%f\n' | sort
          echo
          echo "Documentation:"
          find docs -maxdepth 3 -type f -printf '%p\n' | sort

      - name: Commit migration
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Repository layout is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reorganize templates and project documentation"
          git push origin HEAD:${GITHUB_REF_NAME}
