name: Build Historical Event Library

on:
  workflow_dispatch:
  pull_request:
    paths:
      - story_drafts/**
      - media_reactions/**
      - scripts/build_historical_event_library.py
      - scripts/finalize_historical_event_migration.py
      - scripts/normalize_historical_event_output.py
      - scripts/refine_orin_amelia_watchmans_regret.py
      - scripts/finalize_hawthorne_core_profiles.py
      - scripts/build_vital_mechanics_placeholder.py
      - scripts/refine_vital_mechanics_moral_ambiguity.py
      - scripts/rename_mended_hand.py
      - scripts/clarify_order_shorthand.py
      - scripts/polish_order_shorthand_grammar.py
      - scripts/integrate_canonical_story_drafts.py
      - scripts/add_story_draft_artwork.py
      - scripts/integrate_media_reactions.py
      - scripts/polish_media_reaction_formatting.py
      - .github/workflows/build-historical-event-library.yml

permissions:
  contents: write

concurrency:
  group: historical-events-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-history:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build historical event library
        run: |
          python scripts/build_historical_event_library.py
          python scripts/normalize_historical_event_output.py
          python scripts/finalize_historical_event_migration.py
          python scripts/refine_orin_amelia_watchmans_regret.py
          python scripts/finalize_hawthorne_core_profiles.py
          python scripts/build_vital_mechanics_placeholder.py
          python scripts/refine_vital_mechanics_moral_ambiguity.py
          python scripts/rename_mended_hand.py
          python scripts/clarify_order_shorthand.py
          python scripts/polish_order_shorthand_grammar.py
          python scripts/integrate_canonical_story_drafts.py
          python scripts/add_story_draft_artwork.py
          python scripts/integrate_media_reactions.py
          python scripts/polish_media_reaction_formatting.py

      - name: Refresh development TODO
        run: |
          python scripts/build_canon_development_todo.py
          python scripts/link_canon_development_todo.py

      - name: Verify deterministic output
        shell: bash
        run: |
          find . -type f -name '*.md' -not -path './.git/*' -not -path './unused/*' -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/history-before.sha256
          python scripts/build_historical_event_library.py
          python scripts/normalize_historical_event_output.py
          python scripts/finalize_historical_event_migration.py
          python scripts/refine_orin_amelia_watchmans_regret.py
          python scripts/finalize_hawthorne_core_profiles.py
          python scripts/build_vital_mechanics_placeholder.py
          python scripts/refine_vital_mechanics_moral_ambiguity.py
          python scripts/rename_mended_hand.py
          python scripts/clarify_order_shorthand.py
          python scripts/polish_order_shorthand_grammar.py
          python scripts/integrate_canonical_story_drafts.py
          python scripts/add_story_draft_artwork.py
          python scripts/integrate_media_reactions.py
          python scripts/polish_media_reaction_formatting.py
          python scripts/build_canon_development_todo.py
          python scripts/link_canon_development_todo.py
          find . -type f -name '*.md' -not -path './.git/*' -not -path './unused/*' -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/history-after.sha256
          diff -u /tmp/history-before.sha256 /tmp/history-after.sha256

      - name: Verify Markdown patch
        run: git diff --check

      - name: Commit generated canon
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Historical event library is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md' '**/*.md' scripts/*.py
          git commit -m "Integrate non-canonical public reactions"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
