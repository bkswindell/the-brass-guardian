name: Validate Canon Library

on:
  workflow_dispatch:
  pull_request:
    paths:
      - characters/**
      - locations/**
      - organizations/**
      - artifacts/**
      - vessels/**
      - historical_events/**
      - story_drafts/**
      - story_arcs/**
      - media_reactions/**
      - templates/**
      - docs/standards/AETHERHAVEN_CONTENT_SCHEMA.md
      - docs/standards/CANON_MARKDOWN_STANDARD.md
      - website/scripts/lib/canon-schema-v1.mjs
      - website/scripts/canon-schema-v1.test.mjs
      - website/scripts/canon-schema-v1-templates.test.mjs
      - scripts/verify_media_reaction_markdown.py
      - .github/workflows/build-historical-event-library.yml

permissions:
  contents: read

concurrency:
  group: canon-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-canon:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed canon
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse all canonical Markdown front matter
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'json'
          require 'date'

          roots = %w[characters locations organizations artifacts vessels historical_events story_drafts story_arcs]
          records = []
          failures = []

          roots.each do |root|
            next unless Dir.exist?(root)
            Dir.glob("#{root}/*.md").sort.each do |path|
              next if File.basename(path) == 'README.md'
              text = File.read(path, encoding: 'UTF-8')
              match = text.match(/\A---\s*\n(.*?)\n---\s*\n/m)
              unless match
                failures << "#{path}: missing YAML front matter"
                next
              end

              begin
                meta = YAML.safe_load(match[1], permitted_classes: [Date, Time, DateTime], aliases: false)
              rescue Psych::SyntaxError => error
                failures << "#{path}: invalid YAML: #{error.message.lines.first.strip}"
                next
              end

              unless meta.is_a?(Hash) && meta['schema_version'] == 1
                failures << "#{path}: canonical record is not migrated to schema_version: 1"
                next
              end
              records << meta
            end
          end

          unless failures.empty?
            warn failures.join("\n")
            exit 1
          end

          File.write('/tmp/canon-schema-v1-records.json', JSON.pretty_generate(records) + "\n")
          puts "Parsed #{records.length} Version 1 canonical records."
          RUBY

      - name: Validate complete canonical record graph
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { validateCanonRecords } from './website/scripts/lib/canon-schema-v1.mjs';
          const records = JSON.parse(readFileSync('/tmp/canon-schema-v1-records.json', 'utf8'));
          validateCanonRecords(records);
          console.log(`Validated ${records.length} canonical records against locked Schema Version 1.`);
          NODE

      - name: Run schema and template regression tests
        run: |
          node --test \
            website/scripts/canon-schema-v1.test.mjs \
            website/scripts/canon-schema-v1-templates.test.mjs

      - name: Verify immutable public-reaction formatting
        run: python scripts/verify_media_reaction_markdown.py

      - name: Verify Markdown patch
        run: git diff --check -- . ':(exclude)media_reactions/*.md'

      - name: Confirm validation is read-only
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo 'Canon validation modified the checkout; validation workflows must be read-only.' >&2
            git status --short
            exit 1
          fi
          echo 'Canon validation completed without modifying repository content.'
