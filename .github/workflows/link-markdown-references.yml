name: Link Canon Markdown References

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/link_markdown_references.py
      - .github/workflows/link-markdown-references.yml

permissions:
  contents: write

jobs:
  link-markdown:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Link canonical references
        run: python scripts/link_markdown_references.py

      - name: Verify patch
        run: git diff --check

      - name: Commit linked Markdown
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Markdown references required changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.md' '**/*.md'
          git commit -m "Link canonical Markdown references"
          git push
