name: Build Canon Placeholder Profiles and Links

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/create_placeholder_profiles.py
      - scripts/link_markdown_references.py
      - scripts/run_cached_linker.py
      - .github/workflows/link-markdown-references.yml
      - Location_Profile_Template.md
      - Character_Profile_Template.md
      - Organization_Profile_Template.md

permissions:
  contents: write

concurrency:
  group: canonical-crosslinks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-canon-links:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create missing placeholder profiles
        run: python scripts/create_placeholder_profiles.py

      - name: Link canonical references
        run: python scripts/run_cached_linker.py

      - name: Verify patch
        run: git diff --check

      - name: Commit generated Markdown
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Markdown references or placeholders required changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md' '**/*.md'
          git commit -m "Add missing canon placeholders and cross-links"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
