name: Repair Reorganized Repository Paths
# One-time maintenance workflow; removed after its repair PR merges.

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: repair-reorganized-paths
  cancel-in-progress: false

jobs:
  repair-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Repair doubled migration paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          replacements = {
              'docs/development/docs/development/': 'docs/development/',
              'docs/standards/docs/standards/': 'docs/standards/',
              'docs/reference/docs/reference/': 'docs/reference/',
              'templates/templates/': 'templates/',
              'docs/docs/': 'docs/',
          }
          suffixes = {'.md', '.py', '.yml', '.yaml', '.json', '.toml', '.txt', '.ps1', '.sh'}

          changed = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in suffixes:
                  continue
              posix = path.as_posix()
              if posix.startswith('.git/') or posix.startswith('.github/workflows/') or posix.startswith('unused/'):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, replacement in replacements.items():
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(posix)

          print('Repaired files:')
          for path in changed:
              print(f'  {path}')

          remaining = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in suffixes:
                  continue
              posix = path.as_posix()
              if posix.startswith('.git/') or posix.startswith('.github/workflows/') or posix.startswith('unused/'):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for bad in replacements:
                  if bad in text:
                      remaining.append(f'{posix}: {bad}')
          if remaining:
              raise SystemExit('Doubled paths remain:\n' + '\n'.join(remaining))
          PY

      - name: Remove repair trigger
        run: rm -f .github/reorganized-paths-repair.trigger

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit path repair
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No path repairs required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair paths after repository reorganization"
          git push origin HEAD:${{ github.head_ref }}
