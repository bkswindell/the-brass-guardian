name: Assemble Dock Zero Artifact

on:
  push:
    paths:
      - '.image_staging/dock-zero/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Assemble verified image
        shell: bash
        run: |
          cat .image_staging/dock-zero/chunk_* > /tmp/dock-zero.b64
          base64 --decode /tmp/dock-zero.b64 > "art/AH-1-018_The_Passenger's_Future-Date_Ticket.webp"
          echo "3f7ff021e7c14cf13a8581bb3eb4a494052ad2c44bf0e311cc2aee5ed407d6ba  art/AH-1-018_The_Passenger's_Future-Date_Ticket.webp" | sha256sum --check --strict
          file "art/AH-1-018_The_Passenger's_Future-Date_Ticket.webp"
          rm -f "art/AH-1-018_The_Passenger's_Future-Date_Ticket.png"
          rm -rf .image_staging/dock-zero
          rm -f .github/workflows/assemble-dock-zero-artifact.yml

      - name: Commit assembled artifact
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Dock Zero artifact with correct archival plate"
          git push origin HEAD:${{ github.ref_name }}
